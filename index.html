<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Little Universe ❤️</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #fff5f6 0%, #ffe3e8 100%);
        color: #4a4a4a;
        min-height: 100vh;
        padding: 30px 15px;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header h1 {
        font-family: "Sacramento", cursive;
        font-size: 3rem;
        color: #d63384;
      }

      header p {
        font-size: 0.9rem;
        color: #777;
        margin-top: 5px;
      }

      /* Layout Grid Album */
      .album-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 15px;
        max-width: 800px;
        margin: 0 auto;
      }

      .photo-card {
        background: #fff;
        padding: 8px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        cursor: pointer;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .photo-card:active {
        transform: scale(0.96);
      }

      .photo-card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 12px;
      }

      .photo-card .title {
        font-size: 0.8rem;
        font-weight: 600;
        text-align: center;
        margin-top: 8px;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Pop-up Detail Foto (Modal) */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(5px);
        z-index: 100;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 20px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        position: relative;
        animation: popup 0.3s ease;
      }

      @keyframes popup {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .modal-content img {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 15px;
      }

      .modal-date {
        font-size: 0.75rem;
        color: #d63384;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .modal-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin: 5px 0;
      }

      .modal-desc {
        font-size: 0.85rem;
        color: #666;
        line-height: 1.5;
        margin-bottom: 15px;
      }

      .btn-close {
        background: #ff4b2b;
        color: #fff;
        border: none;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Kisah Kita ❤️</h1>
      <p>Setiap foto punya cerita manisnya sendiri.</p>
    </header>

    <!-- Daftar Album Foto -->
    <div class="album-grid" id="albumGrid"></div>

    <!-- Modal Pop-up -->
    <div class="modal" id="photoModal">
      <div class="modal-content">
        <img id="modalImg" src="" alt="Foto Kenangan" />
        <div class="modal-date" id="modalDate">30 Agustus 2026</div>
        <div class="modal-title" id="modalTitle">Album with Princes</div>
        <div class="modal-desc" id="modalDesc">
          Cerita singkat tentang foto ini...
        </div>
        <button class="btn-close" onclick="closeModal()">Tutup ✨</button>
      </div>
    </div>

    <script>
      // DATA FOTO DAN CERITA (Tinggal lu edit/tambah di sini)
      const myPhotos = [
        {
          img: "images/foto1.jpeg",
          title: "Pertama Kali Ketemu",
          date: "30 Agustus 2026",
          desc: "Aku ngerayain hari spesial aku di Cikuray whit you, firts time juga kamu gandeng aku.",
        },
        {
          img: "images/2.jpeg",
          title: "Jalan-Jalan Perdana",
          date: "2 September 2026",
          desc: "Firts time kita jalan cuma buat beli matcha dan ngobrol.",
        },
        {
          img: "images/5.jpeg",
          title: "Movie Date kita",
          date: "03 September 2026",
          desc: "Momen paling seru! Nonton film horor walaupun aku teriak dikit karena kaget😅.",
        },
        {
          img: "images/3.jpeg",
          title: "After Makan bareng",
          date: "12 Agustus 2025",
          desc: "Aku ngerasa foto ini lucu banget, romantisnya kerasa.",
        },
        {
          img: "images/6.jpeg",
          title: "Gak tau ini kapan tapi lucuu",
          date: "- September 2026",
          desc: "Dari sini kata Ell melet mulai mucul, aku juga ngerasa ini lucu sama sedikit tengil.",
        },
        {
          img: "images/RunDate.jpeg",
          title: "Kali pertama kita lari bareng",
          date: "6 September 2026",
          desc: "ini juga kali pertama aku jemput kamu buat olahraga bareng, aku seneng banget bisa lari bareng kamu.",
        },
        {
          img: "images/Phostud.jpeg",
          title: "Foto Studio Bareng Kamu",
          date: "13 September 2026",
          desc: "Ini juga kali pertama kita foto studio bareng, aku seneng banget bisa foto bareng kamu.",
        },
        {
          img: "images/gachoDate.jpeg",
          title: "Gachoan Bareng Kamu",
          date: "13 September 2026",
          desc: "Ini juga kali pertama kita gachoan bareng, aku seneng banget bisa makan bareng kamu.",
        },
      ];

      // Generate Grid Foto Otomatis
      const grid = document.getElementById("albumGrid");
      myPhotos.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "photo-card";
        card.onclick = () => openModal(index);
        card.innerHTML = `
                <img src="${item.img}" alt="${item.title}">
                <div class="title">${item.title}</div>
            `;
        grid.appendChild(card);
      });

      // Buka Pop-up Foto
      function openModal(index) {
        const data = myPhotos[index];
        document.getElementById("modalImg").src = data.img;
        document.getElementById("modalDate").innerText = data.date;
        document.getElementById("modalTitle").innerText = data.title;
        document.getElementById("modalDesc").innerText = data.desc;
        document.getElementById("photoModal").style.display = "flex";
      }

      // Tutup Pop-up
      function closeModal() {
        document.getElementById("photoModal").style.display = "none";
      }
    </script>
  </body>
</html>
